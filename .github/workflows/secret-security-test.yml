name: Secret Security Test

on:
  push:
    branches:
      - secret-security-test

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Verify secret is available
        env:
          DB_PASSWORD: ${{ secrets.SECUREBANK_DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "Secret is NOT available"
            exit 1
          fi

          echo "Secret is available to the workflow"
