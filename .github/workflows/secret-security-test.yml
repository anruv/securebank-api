name: Secret Security Test

on:
  push:
    branches:
      - secret-security-test

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Test secret masking
        env:
          DB_PASSWORD: ${{ secrets.SECUREBANK_DB_PASSWORD }}
        run: |
          echo "Testing GitHub secret masking..."
          echo "Password value: $DB_PASSWORD"
